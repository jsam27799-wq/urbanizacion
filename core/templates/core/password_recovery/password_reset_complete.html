{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña actualizada | Piemonte</title>
    <link rel="stylesheet" href="{% static 'core/css/tooplate-strategic-style.css' %}?v=20">
</head>
<body>
    <nav class="navbar login-navbar recovery-navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon"><img src="{% static 'core/images/logo.png' %}" alt="Logo" width="60" height="60"></div>
                <span>Urbanización Piemonte</span>
            </a>
            <ul class="nav-links"><li><a href="/">Volver al menú</a></li></ul>
        </div>
    </nav>
    <section class="hero login-hero recovery-hero">
        <div class="hero-content login-card recovery-card" aria-labelledby="recovery-title">
            <span class="recovery-status" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
            </span>
            <p class="recovery-eyebrow">Proceso completado</p>
            <h1 id="recovery-title">Contraseña actualizada</h1>
            <p>Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con tus nuevos datos.</p>
            <a class="cta-button" href="{% url 'login' %}">Ir al inicio de sesión</a>
        </div>
    </section>
</body>
</html>
