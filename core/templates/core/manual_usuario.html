{% extends 'core/base.html' %}

{% block title %}Manual de usuario | Piemonte{% endblock %}

{% block content %}
<section class="manual-page">
    <div class="manual-page__card">
        <p class="manual-page__eyebrow">Centro de ayuda</p>
        <h1>Manual de usuario</h1>
        {% include "core/includes/manual_user_content.html" with manual_prefix="pagina" %}
    </div>
</section>
<style>
    .manual-page { min-height: 55vh; display: grid; place-items: center; padding: 3rem 1rem; }
    .manual-page__card { width: min(100%, 980px); padding: clamp(1.25rem, 4vw, 2.5rem); background: #fff; border: 1px solid #dce9e5; border-radius: 22px; box-shadow: 0 18px 48px rgba(23, 63, 58, .12); }
    .manual-page__eyebrow { margin: 0 0 .6rem; color: #16866f; font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .manual-page h1 { margin: 0 0 1rem; color: #173f3a; font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 800; }
    .manual-page__card > p:not(.manual-page__eyebrow) { color: #536761; font-size: 1rem; line-height: 1.7; }
</style>
{% endblock %}
